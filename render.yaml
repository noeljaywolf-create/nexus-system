services:
  - type: web
    name: nexus-system
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python launcher.py --port $PORT --no-browser
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NEXUS_ALLOWED_HOSTS
        value: nexus-system-0cd6.onrender.com
      - key: NEXUS_SECURE_COOKIE
        value: "1"
